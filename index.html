<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faculty of Design, Art &amp; Performance | Department Timetable</title>
    <!-- Content Security Policy: only this site's own scripts and styles may
         run, and the only server the page may contact is Google Sheets (for
         the timetable data). Inline scripts and event-handler attributes are
         refused, so even markup that slipped into the sheet could not execute.
         GitHub Pages can't send response headers, hence the meta tag. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src https://docs.google.com; base-uri 'none'; form-action 'none'; object-src 'none'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="stylesheet" href="css/style.css?v=20" />
  </head>
  <!-- ?v=N on the CSS and JS: GitHub Pages caches these filenames hard, so a
       push can leave people staring at the previous build until they force a
       reload. Bumping this number makes the URL new, which the browser has to
       fetch. Increment it whenever app.js, loader.js, config.js or style.css
       changes. -->
  <body>
    <header class="top-bar">
      <div class="brand">
        <h1>Faculty of Design, Art &amp; Performance</h1>
        <p id="pageSubtitle">Department Timetable</p>
      </div>
    </header>

    <!-- Slim toolbar: the filter rail's show/hide sits on the left the way
         Titan Eye+ puts "Hide Filters" above its rail, week navigation in the
         middle. Filters no longer occupy a permanent horizontal band, which is
         what used to push the grid down the page. -->
    <div class="toolbar">
      <!-- One control, two shapes: a labelled Hide/Show Filters button on the
           desktop rail, a hamburger on phones where the rail becomes a drawer. -->
      <button id="toggleFiltersBtn" class="filters-toggle" type="button" aria-expanded="false" aria-controls="filterRail">
        <span class="filters-burger" aria-hidden="true">&#9776;</span>
        <span class="filters-toggle-icon" aria-hidden="true">&#8677;</span>
        <span id="toggleFiltersLabel">Show Filters</span>
        <span id="filterCountBadge" class="filters-count" hidden></span>
      </button>

      <div class="week-controls">
        <button id="prevWeekBtn" class="btn">&larr; Previous Week</button>
        <h2 id="currentWeekDisplay">Loading timetable…</h2>
        <button id="nextWeekBtn" class="btn">Next Week &rarr;</button>
      </div>

      <button id="jumpToTodayBtn" class="btn btn-secondary is-hidden" aria-hidden="true" tabindex="-1">Jump to Current Week</button>
    </div>

    <!-- The five filters still exist as real form controls so every existing
         filter behaviour (cross-linking, reset, option rebuilding) keeps
         working unchanged. The rail is a view onto them: clicking an option in
         the rail sets the control and fires its change event. They are hidden
         visually, not with display:none, so they stay focusable by scripts. -->
    <div class="visually-hidden" aria-hidden="true">
      <!-- Options are filled from the sheet's data in app.js (buildFilterChoices). -->
      <select id="levelFilter"><option value="all">UG &amp; PG</option></select>
      <select id="courseTypeFilter"><option value="all">Semester &amp; Term</option></select>
      <select id="semNumberFilter"><option value="all">All Semesters &amp; Terms</option></select>
      <select id="courseFilter"><option value="all">All Courses</option></select>
      <select id="venueFilter"><option value="all">All Venues</option></select>
      <select id="facultyStatusFilter"><option value="all">All Faculty Types</option></select>
    </div>

    <div class="workspace rail-hidden" id="workspace">
      <!-- Titan-style rail: a category column on the left, the selected
           category's options beside it. -->
      <aside class="filter-rail" id="filterRail" aria-hidden="true">
        <div class="rail-head">
          <span class="rail-title">Filters</span>
          <button type="button" id="resetFiltersBtn" class="link-btn">Reset all</button>
        </div>
        <div class="rail-body">
          <div class="rail-cats" id="railCats" role="tablist" aria-label="Filter categories"></div>
          <div class="rail-options" id="railOptions"></div>
        </div>
      </aside>

      <main class="workspace-main">
        <!-- Phones get a day at a time: tabs here, an agenda list below, and
             the week grid hidden. Comparing five days side by side is the one
             thing a 390px screen cannot do, so it does one day properly
             instead. Both views are rendered from the same data by renderGrid. -->
        <div class="day-tabs" id="dayTabs" role="tablist" aria-label="Day"></div>

        <p id="dataNotice" class="data-notice" role="status" hidden></p>
        <p id="weekJumpNotice" class="week-jump-notice" hidden></p>

        <section class="grid-card">
          <div class="agenda-view" id="agendaView"></div>
          <div class="table-responsive">
          <table id="timetableGrid">
            <thead>
              <tr>
                <th class="time-col">Time Slot</th>
                <th id="th-Mon">Monday</th>
                <th id="th-Tue">Tuesday</th>
                <th id="th-Wed">Wednesday</th>
                <th id="th-Thu">Thursday</th>
                <th id="th-Fri">Friday</th>
              </tr>
            </thead>
            <tbody id="gridBody"><!-- one row per slot, built from the sheet --></tbody>
          </table>
          </div>
        </section>
      </main>
    </div>

    <!-- Scripts: config (which sheet), loader (reads it), app (draws it) -->
    <script src="js/config.js?v=20"></script>
    <script src="js/loader.js?v=20"></script>
    <script src="js/app.js?v=20"></script>
  </body>
</html>
